<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>[必填] 管理咨询演示标题</title>
<style>
:root{--navy:#14395f;--ink:#172033;--muted:#667386;--line:#dce2e9;--soft:#f4f6f8;--teal:#167b76;--amber:#a96812;--red:#a33f42;--safe-bottom:7vh}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9edf1;color:var(--ink);font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",Arial,sans-serif}.deck{height:100%;display:flex;transition:transform .2s ease}.slide{position:relative;flex:0 0 100vw;height:100vh;background:#fff;padding:5.5vh 5.5vw var(--safe-bottom);overflow:hidden;display:flex;flex-direction:column}.slide.cover,.slide.section,.slide.closing{background:var(--navy);color:#fff}.slide.soft{background:var(--soft)}.top{display:flex;justify-content:space-between;padding-bottom:1.5vh;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}.cover .top,.section .top,.closing .top{border-color:rgba(255,255,255,.25);color:rgba(255,255,255,.72)}.content{flex:1;min-height:0;padding-top:4vh;display:flex;flex-direction:column}h1,h2,h3,p{margin:0}h1{font-size:clamp(42px,5vw,76px);line-height:1.08;letter-spacing:-.03em;font-weight:650}h2{font-size:clamp(30px,3vw,46px);line-height:1.18;letter-spacing:-.02em;font-weight:650;max-width:none;width:100%;word-break:normal;overflow-wrap:normal;text-wrap:pretty}h3{font-size:20px;font-weight:650}.lead{font-size:clamp(18px,1.5vw,24px);line-height:1.6;color:#435064}.cover .lead,.section .lead,.closing .lead{color:rgba(255,255,255,.82)}.rule{height:2px;background:var(--navy);margin-top:4vh}.grid-2,.grid-3,.grid-4{display:grid;gap:3vw;margin-top:4vh}.grid-2{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}.grid-4{grid-template-columns:repeat(4,1fr);gap:2vw}.module{border-top:3px solid var(--navy);padding-top:1.8vh}.module p{margin-top:1vh;font-size:17px;line-height:1.55;color:#4c596c}.metric{font-size:clamp(48px,6vw,90px);line-height:1;font-weight:650;color:var(--navy);font-variant-numeric:tabular-nums}.data-hero{font-size:clamp(76px,11vw,160px);line-height:.95;font-weight:680;color:var(--navy);font-variant-numeric:tabular-nums}.image-frame{overflow:hidden;background:var(--soft);border:1px solid var(--line)}.image-frame img{display:block;width:100%;height:100%;object-fit:cover}.image-frame.contain img{object-fit:contain}.r-16x9{aspect-ratio:16/9}.r-16x10{aspect-ratio:16/10}.r-4x3{aspect-ratio:4/3}.caption{margin-top:1vh;font-size:15px;line-height:1.45;color:var(--muted)}.table{width:100%;border-collapse:collapse;margin-top:4vh;table-layout:fixed}.table th{text-align:left;background:var(--navy);color:#fff;padding:1.2vh 1vw;font-size:15px}.table td{padding:1.4vh 1vw;border-bottom:1px solid var(--line);font-size:16px;line-height:1.45;vertical-align:top}.table tr:nth-child(even){background:var(--soft)}.source{position:absolute;left:5.5vw;bottom:2.2vh;font-size:13px;color:var(--muted)}.nav{position:fixed;right:2vw;bottom:2vh;display:flex;gap:7px}.dot{width:20px;height:4px;border:0;background:#c8d0d9}.dot.active{width:32px;background:var(--navy)}.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:1.5vh;font-size:13px;color:#7b8594}@media(prefers-reduced-motion:reduce){.deck{transition:none}}@media print{@page{size:landscape;margin:0}html,body{overflow:visible}.deck{display:block;transform:none!important}.slide{page-break-after:always}.nav,.hint{display:none}}
.cover-content{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4vh 0 8vh}.cover-title{font-size:clamp(64px,9vw,138px);line-height:1.04;font-weight:680;letter-spacing:-.035em;max-width:10em}.cover-subtitle{margin-top:2.2vh;font-size:clamp(18px,1.6vw,25px);font-weight:500;color:rgba(255,255,255,.8)}.cover-meta{margin-top:5vh;font-size:14px;font-weight:500;color:rgba(255,255,255,.62);letter-spacing:.04em}
.source{bottom:4.7vh}
.center-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4vh 8vw 8vh}.center-title{font-size:clamp(48px,6vw,92px);line-height:1.12;font-weight:680;letter-spacing:-.035em;max-width:13em}.center-copy{margin-top:2.5vh;font-size:clamp(18px,1.6vw,25px);line-height:1.55;color:var(--muted);max-width:34em}.dark .center-copy{color:rgba(255,255,255,.76)}
.top span:first-child{font-size:18px;font-weight:700;letter-spacing:0}</style></head><body>
<main class="deck" id="deck">
<!-- SLIDES_HERE: replace examples; every slide needs data-layout="Cxx" and data-slide-id="stable-id" -->
<section class="slide cover" data-layout="C01" data-slide-id="cover"><div class="top"><span>[可选] 演示场景或章节</span><span>01 / NN</span></div><div class="cover-content"><h1 class="cover-title">[必填] 演示主题</h1><p class="cover-subtitle">[可选] 一句话副标题</p><div class="cover-meta">[可选] 演讲者 · 场景信息</div></div></section>
<section class="slide" data-layout="C02" data-slide-id="executive-summary"><div class="top"><span>执行摘要</span><span>02 / NN</span></div><div class="content"><h2>[必填] 行动标题：直接说出管理层需要带走的结论</h2><div class="grid-3"><div class="module"><h3>01 · 发现</h3><p>[必填] 事实和证据。</p></div><div class="module"><h3>02 · 含义</h3><p>[必填] 为什么重要。</p></div><div class="module"><h3>03 · 建议</h3><p>[必填] 应采取的行动。</p></div></div></div></section>
</main><div class="hint">← → 翻页 · 滚轮 / 触屏 · Home / End</div><nav class="nav" id="nav"></nav>
<script>(()=>{const deck=document.getElementById('deck'),slides=[...document.querySelectorAll('.slide')],nav=document.getElementById('nav'),total=slides.length;let i=0,lock=false,x=0;slides.forEach((slide,n)=>{const page=slide.querySelector('.top span:last-child');if(page)page.textContent=`${String(n+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}`;const b=document.createElement('button');b.className='dot';b.ariaLabel=`第${n+1}页`;b.onclick=()=>go(n);nav.appendChild(b)});const dots=[...nav.children];function go(n){i=Math.max(0,Math.min(slides.length-1,n));deck.style.transform=`translateX(${-i*100}vw)`;dots.forEach((d,k)=>d.classList.toggle('active',k===i))}addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(i+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(i-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1)});addEventListener('wheel',e=>{if(lock||Math.abs(e.deltaY)<12)return;lock=true;go(i+(e.deltaY>0?1:-1));setTimeout(()=>lock=false,380)},{passive:true});addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>50)go(i+(d<0?1:-1))},{passive:true});go(0)})();</script>
</body></html>
